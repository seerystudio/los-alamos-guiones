<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de guiones · Los Álamos</title>
<meta name="description" content="Diez referencias de reels adaptadas a Quinta Los Álamos, con tres guiones por referencia.">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'General Sans';src:url(assets/generalsans-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'General Sans';src:url(assets/generalsans-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'General Sans';src:url(assets/generalsans-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'General Sans';src:url(assets/generalsans-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Cabinet Grotesk';src:url(assets/cabinetgrotesk-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Cabinet Grotesk';src:url(assets/cabinetgrotesk-800.woff2) format('woff2');font-weight:800;font-display:swap}

/* Sistema del estudio: el mismo de portfolio/personal.html y de la propuesta de Solmi.
   Negro, hueso, gris y un solo acento naranja. Las tarjetas de guion van en «campo claro»:
   mismos colores, roles invertidos, así se leen de lejos mientras se graba. */
:root{
  --negro:#0E0E0E; --negro-2:#141414; --negro-3:#1C1C1C;
  --hueso:#F5F4F2; --gris:#A2A29E; --gris-2:#807F79;
  --naranja:#FF4D00;
  --linea:rgba(255,255,255,.11); --linea-2:rgba(255,255,255,.2);
  --sans:'General Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tit:'Cabinet Grotesk','General Sans',system-ui,sans-serif;
  --sal:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--hueso);background:var(--negro);font-size:15px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--naranja);color:#fff}
:focus-visible{outline:2px solid var(--naranja);outline-offset:3px}

/* barra */
.bar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(14,14,14,.88);backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--linea)}
.bar h1{font-family:var(--tit);font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0;white-space:nowrap;display:flex;align-items:center;gap:10px}
.bar h1 i{width:8px;height:8px;border-radius:50%;background:var(--naranja);display:block}
.bar h1 small{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:0;color:var(--gris)}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--linea-2);border-radius:100px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.03)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--gris);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--hueso);color:var(--negro)}
.chip{border:1px solid var(--linea-2);background:rgba(255,255,255,.03);border-radius:100px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--hueso)}
.chip[aria-pressed="true"]{border-color:var(--naranja);background:var(--naranja);color:#fff}
select.chip{appearance:none}
select.chip option{background:var(--negro-2);color:var(--hueso)}

/* tablero */
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--negro);background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.2px);background-size:26px 26px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;padding:110px 64px 140px;display:flex;flex-direction:column;gap:96px;width:max-content}
.zoomui{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:6px}
.zoomui button{width:44px;height:44px;border-radius:100px;border:1px solid var(--linea-2);background:rgba(20,20,20,.9);backdrop-filter:blur(8px);font-size:18px;font-weight:600;color:var(--hueso);transition:background .25s var(--sal)}
.zoomui button:hover{background:var(--naranja);border-color:var(--naranja)}

/* fila */
.row{display:flex;gap:24px;align-items:flex-start;position:relative}
.row-title{position:absolute;top:-52px;left:0;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.row-title .n{font-family:var(--tit);font-size:15px;font-weight:800;color:var(--naranja);letter-spacing:.02em}
.row-title .f{font-family:var(--tit);font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
.row-title .m{font-size:14px;color:var(--gris)}

.card{border-radius:18px;cursor:auto}
.ref{width:340px;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--negro-2);border:1px solid var(--linea)}
.ref .who{font-size:13px;color:var(--gris)}
.ref .who b{color:var(--hueso);font-weight:600}
.vid{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--negro-3);border:1px solid var(--linea);display:grid;place-items:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vid .ph{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--gris);text-align:center;padding:22px;font-size:14px}
.vid .ph button{border:1px solid var(--naranja);background:var(--naranja);color:#fff;border-radius:100px;padding:12px 22px;font-weight:600;transition:transform .3s var(--sal)}
.vid .ph button:hover{transform:translateY(-2px)}
.vid .ph a{font-size:13px}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font-size:12px;font-weight:500;color:var(--gris);border:1px solid var(--linea-2);border-radius:100px;padding:4px 10px}
.sticky{border-left:2px solid var(--naranja);padding:4px 0 4px 14px;font-size:14px;color:var(--hueso)}
.sticky h4{margin:0 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--naranja)}
.sticky ol{margin:0;padding-left:18px}
.sticky li{margin:4px 0}
.sticky li::marker{color:var(--gris-2);font-weight:600}
details.tr{border-top:1px solid var(--linea);padding-top:12px}
details.tr summary{font-weight:600;font-size:13px;cursor:pointer;color:var(--gris)}
details.tr pre{white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--gris);margin:10px 0 0;max-height:340px;overflow:auto}

/* guion: campo claro */
.g{width:450px;overflow:hidden;position:relative;background:var(--hueso);color:#141414;border:1px solid transparent;
  --tenue:#63625E; --lin:rgba(0,0,0,.12); transition:box-shadow .3s var(--sal)}
.g header{padding:18px 18px 14px;border-bottom:1px solid var(--lin);position:relative}
.g .var{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin-bottom:8px}
.g .var::before{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--tit);font-size:13px;letter-spacing:0;color:#fff;background:#141414;box-sizing:border-box}
.g[data-v="A"] .var::before{content:"A";background:var(--naranja)}
.g[data-v="B"] .var::before{content:"B"}
.g[data-v="C"] .var::before{content:"C";background:transparent;color:#141414;border:1.5px solid #141414}
.g h3{font-family:var(--tit);margin:0;font-size:25px;font-weight:800;line-height:1.05;letter-spacing:-.03em;padding-right:48px}
.g .angle{margin:8px 0 0;font-size:13.5px;color:var(--tenue)}
.star{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--lin);background:transparent;font-size:18px;line-height:1;color:#141414;transition:background .25s,color .25s,transform .3s var(--sal)}
.star:hover{transform:scale(1.06)}
.star[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja);color:#fff}
.g.pick{box-shadow:0 0 0 3px var(--naranja),0 18px 50px rgba(255,77,0,.18)}
.sec{padding:14px 18px;border-bottom:1px solid var(--lin)}
.sec:last-child{border-bottom:0}
.lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--naranja);margin:0 0 8px}
.hook{display:grid;gap:6px}
.hook div{font-size:14px}
.hook b{display:inline-block;min-width:56px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tenue)}
.hook .say{font-family:var(--tit);font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.marco{font-size:12.5px;color:var(--tenue);margin-top:6px}
.beats{display:flex;flex-direction:column}
.beat{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--lin)}
.beat:first-child{border-top:0;padding-top:0}
.beat .t{font-size:12px;font-weight:700;color:var(--tenue);font-variant-numeric:tabular-nums;padding-top:3px}
.beat .p{font-size:12.5px;color:var(--tenue)}
.beat .a{font-size:15px;font-weight:500;color:#141414}
.beat .a:empty{display:none}
.beat .d{font-size:12px;color:#C23A00;font-weight:600}
.cta{font-weight:600;font-size:15px}
ul.shots{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.shots li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
ul.shots input{margin-top:3px;accent-color:var(--naranja);width:17px;height:17px;flex-shrink:0}
ul.shots input:checked + label{color:var(--tenue);text-decoration:line-through}
.warn{font-size:13px;background:#141414;color:var(--hueso);border-radius:12px;padding:10px 12px}
.cap{font-size:13px;color:var(--tenue);white-space:pre-line}

/* intro */
.intro{width:420px;padding:26px;background:var(--negro-2);border:1px solid var(--linea)}
.intro .rotulo{display:block;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--naranja);margin:0 0 14px}
.intro h2{font-family:var(--tit);margin:0 0 14px;font-size:40px;font-weight:800;line-height:1;letter-spacing:-.038em}
.intro p{margin:0 0 12px;font-size:14.5px;color:var(--gris)}
.intro ul{margin:16px 0 0;padding:16px 0 0 18px;border-top:1px solid var(--linea);font-size:14px}
.intro li{margin:4px 0}
.intro li::marker{color:var(--naranja)}

/* lista (celular) */
body.list #vp{position:static;overflow:visible;touch-action:auto;cursor:auto;min-height:100%}
body.list #world{position:static;transform:none!important;padding:84px 16px 64px;width:auto;gap:72px}
body.list .zoomui{display:none}
body.list .row{flex-direction:column;align-items:stretch;gap:16px}
body.list .row-title{position:static;white-space:normal;flex-wrap:wrap;row-gap:4px}
body.list .row-title .f{font-size:26px}
body.list .row-title .m{flex-basis:100%}
body.list .ref,body.list .intro{width:auto}
body.list .intro h2{font-size:32px}
body.list .scripts{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
body.list .g{flex:0 0 88%;max-width:450px;scroll-snap-align:center}
body.list .vid{max-width:300px;margin:0 auto;width:100%}
.scripts{display:flex;gap:24px;align-items:flex-start}
body.onlypicks .g:not(.pick){display:none}
body.onlypicks .row:not(:has(.g.pick)){display:none}
@media (max-width:700px){
  .bar{gap:6px;padding:10px 12px}
  .bar h1{font-size:16px}
  .bar h1 small,#onlypicks .t{display:none}
  .chip,.seg button{padding:6px 10px;font-size:12px}
  select.chip{max-width:84px}
}
@media (max-width:480px){.seg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <h1><i></i>Los Álamos<small>guiones · grabación 18/09</small></h1>
  <span class="sp"></span>
  <select class="chip" id="jump" aria-label="Ir a la referencia"></select>
  <button class="chip" id="onlypicks" aria-pressed="false">★<span class="t"> Elegidos</span></button>
  <div class="seg" role="group" aria-label="Vista">
    <button id="mBoard" aria-pressed="true">Tablero</button>
    <button id="mList" aria-pressed="false">Lista</button>
  </div>
</div>
<div id="vp"><div id="world"></div></div>
<div class="zoomui"><button id="zout" aria-label="Alejar">−</button><button id="zfit" aria-label="Encajar">⤢</button><button id="zin" aria-label="Acercar">+</button></div>

<script src="guiones.js"></script>
<script src="refs-1.js"></script>
<script src="refs-2.js"></script>
<script src="refs-3.js"></script>
<script src="refs-4.js"></script>
<script>
const D = window.GUIONES;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let picks = store.get('la-picks', {});
let shots = store.get('la-shots', {});

function renderScript(r, g){
  const key = r.n + g.v;
  const beats = g.beats.map(b => `<div class="beat"><div class="t">${esc(b[0])}</div><div>
      ${b[1] ? `<div class="p">🎥 ${esc(b[1])}</div>` : ''}
      <div class="a">${esc(b[2])}</div>
      ${b[3] ? `<div class="d">↳ ${esc(b[3])}</div>` : ''}</div></div>`).join('');
  const sh = (g.shots || []).map((s, i) => {
    const id = key + '-' + i;
    return `<li><input type="checkbox" data-shot="${id}" ${shots[id] ? 'checked' : ''} id="s${id}"><label for="s${id}">${esc(s)}</label></li>`;
  }).join('');
  return `<article class="card g ${picks[r.n] === g.v ? 'pick' : ''}" data-v="${g.v}" data-n="${r.n}">
    <header>
      <span class="var">${esc(g.tipo)}</span>
      <h3>${esc(g.titulo)}</h3>
      <p class="angle">${esc(g.angulo)}</p>
      <button class="star" data-pick="${r.n}|${g.v}" aria-pressed="${picks[r.n] === g.v}" aria-label="Elegir este guion">★</button>
    </header>
    <div class="sec"><p class="lab">Hook · primeros 3 segundos</p>
      <div class="hook">
        <div class="say">«${esc(g.hook.dice)}»</div>
        <div><b>Placa</b> ${esc(g.hook.placa)}</div>
        <div><b>Plano</b> ${esc(g.hook.plano)}</div>
      </div>
      <div class="marco">Marco: ${esc(g.hook.marco)}</div>
    </div>
    <div class="sec"><p class="lab">Guion · ${esc(g.dur)}</p><div class="beats">${beats}</div></div>
    <div class="sec"><p class="lab">Cierre</p><div class="cta">${esc(g.cta)}</div></div>
    ${sh ? `<div class="sec"><p class="lab">Planos a grabar</p><ul class="shots">${sh}</ul></div>` : ''}
    ${g.ojo ? `<div class="sec"><div class="warn">⚠️ ${esc(g.ojo)}</div></div>` : ''}
    ${g.caption ? `<div class="sec"><p class="lab">Caption</p><div class="cap">${esc(g.caption)}</div></div>` : ''}
  </article>`;
}

function renderRef(r){
  const vid = r.id
    ? `<div class="vid" data-embed="${r.id}"><div class="ph"><button type="button">▶ Ver el reel</button><a href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener">abrir en Instagram ↗</a></div></div>`
    : `<div class="vid"><div class="ph">${esc(r.sinVideo || 'Sin referencia externa')}</div></div>`;
  return `<aside class="card ref">
    ${vid}
    <div class="who">${r.cuenta ? `<b>${esc(r.cuenta)}</b> · ` : ''}${esc(r.datos || '')}</div>
    <div class="kv">${(r.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <div class="sticky"><h4>Por qué funciona</h4><ol>${r.mecanica.map(m => `<li>${esc(m)}</li>`).join('')}</ol></div>
    ${r.transcripcion ? `<details class="tr"><summary>Transcripción</summary><pre>${esc(r.transcripcion)}</pre></details>` : ''}
  </aside>`;
}

function render(){
  const intro = `<section class="row" id="r0"><div class="card intro">
    <span class="rotulo">Quinta Los Álamos · reels</span>
    <h2>${esc(D.titulo)}</h2>
    ${D.intro.map(p => `<p>${esc(p)}</p>`).join('')}
    <ul>${D.reglas.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
  </div></section>`;
  $('#world').innerHTML = intro + D.refs.map(r => `<section class="row" id="r${r.n}">
    <div class="row-title"><span class="n">${String(r.n).padStart(2,'0')}</span><span class="f">${esc(r.formato)}</span><span class="m">${esc(r.resumen)}</span></div>
    ${renderRef(r)}
    <div class="scripts">${r.guiones.map(g => renderScript(r, g)).join('')}</div>
  </section>`).join('');
  $('#jump').innerHTML = `<option value="0">Ir a…</option>` + D.refs.map(r => `<option value="${r.n}">${String(r.n).padStart(2,'0')} · ${esc(r.formato)}</option>`).join('');
}
render();

/* interacciones */
document.addEventListener('click', e => {
  const st = e.target.closest('[data-pick]');
  if (st){
    const [n, v] = st.dataset.pick.split('|');
    picks[n] = picks[n] === v ? null : v;
    store.set('la-picks', picks);
    document.querySelectorAll(`.g[data-n="${n}"]`).forEach(g => {
      const on = picks[n] === g.dataset.v;
      g.classList.toggle('pick', on);
      g.querySelector('.star').setAttribute('aria-pressed', on);
    });
    return;
  }
  const pb = e.target.closest('.vid[data-embed] button');
  if (pb){
    const box = pb.closest('.vid');
    box.innerHTML = `<iframe src="https://www.instagram.com/reel/${box.dataset.embed}/embed" loading="lazy" allowfullscreen scrolling="no"></iframe>`;
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.shot){ shots[e.target.dataset.shot] = e.target.checked; store.set('la-shots', shots); }
});
$('#onlypicks').onclick = function(){
  const on = this.getAttribute('aria-pressed') !== 'true';
  this.setAttribute('aria-pressed', on);
  document.body.classList.toggle('onlypicks', on);
};

/* tablero: pan y zoom */
const vp = $('#vp'), world = $('#world');
let tx = 0, ty = 0, sc = 0.6;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
const zoomAt = (f, cx, cy) => {
  const ns = Math.min(1.6, Math.max(0.15, sc * f));
  tx = cx - (cx - tx) * (ns / sc); ty = cy - (cy - ty) * (ns / sc); sc = ns; apply();
};
const pts = new Map(); let last = null, pinch = null;
vp.addEventListener('pointerdown', e => {
  if (document.body.classList.contains('list')) return;
  if (e.target.closest('button,a,input,label,summary,select,iframe,pre,.beats,.cap')) return;
  vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  last = [e.clientX, e.clientY]; vp.classList.add('drag');
});
vp.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2){
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0]-b[0], a[1]-b[1]), cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2;
    if (pinch) zoomAt(d / pinch, cx, cy);
    pinch = d; return;
  }
  tx += e.clientX - last[0]; ty += e.clientY - last[1]; last = [e.clientX, e.clientY]; apply();
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) vp.classList.remove('drag'); else last = [...pts.values()][0]; };
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
vp.addEventListener('wheel', e => {
  if (document.body.classList.contains('list')) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, {passive:false});
$('#zin').onclick = () => zoomAt(1.2, innerWidth/2, innerHeight/2);
$('#zout').onclick = () => zoomAt(1/1.2, innerWidth/2, innerHeight/2);
$('#zfit').onclick = () => { sc = Math.min(1, (innerWidth - 40) / world.scrollWidth); tx = 20; ty = 10; apply(); };

function goTo(n){
  const el = document.getElementById('r' + n); if (!el) return;
  if (document.body.classList.contains('list')){ window.scrollTo({top: el.offsetTop - 60, behavior:'smooth'}); return; }
  sc = Math.max(sc, 0.7);
  tx = 20 - el.offsetLeft * sc; ty = 70 - (el.offsetTop - 50) * sc; apply();
}
$('#jump').onchange = e => { goTo(e.target.value); e.target.value = '0'; };

function setMode(m){
  document.body.classList.toggle('list', m === 'list');
  $('#mList').setAttribute('aria-pressed', m === 'list');
  $('#mBoard').setAttribute('aria-pressed', m !== 'list');
  store.set('la-mode', m);
  if (m !== 'list') apply();
}
$('#mBoard').onclick = () => setMode('board');
$('#mList').onclick = () => setMode('list');
setMode(store.get('la-mode', innerWidth < 900 ? 'list' : 'board'));
apply();
</script>
</body>
</html>
