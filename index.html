<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guiones · Solmi & Asociados</title>
<meta name="description" content="Once guiones para los primeros videos del estudio, con lugar para las respuestas de Víctor.">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'General Sans';src:url(assets/generalsans-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'General Sans';src:url(assets/generalsans-500.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'General Sans';src:url(assets/generalsans-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'General Sans';src:url(assets/generalsans-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Cabinet Grotesk';src:url(assets/cabinetgrotesk-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Cabinet Grotesk';src:url(assets/cabinetgrotesk-800.woff2) format('woff2');font-weight:800;font-display:swap}

/* Sistema del estudio: el mismo de portfolio/personal.html y de la propuesta de Solmi.
   Negro, hueso, gris y un solo acento naranja. Las tarjetas de guion van en «campo claro»:
   mismos colores, roles invertidos, así se leen de lejos mientras se graba. */
:root{
  --negro:#0E0E0E; --negro-2:#141414; --negro-3:#1C1C1C;
  --hueso:#F5F4F2; --gris:#A2A29E; --gris-2:#807F79;
  --naranja:#FF4D00;
  --linea:rgba(255,255,255,.11); --linea-2:rgba(255,255,255,.2);
  --sans:'General Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tit:'Cabinet Grotesk','General Sans',system-ui,sans-serif;
  --sal:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--hueso);background:var(--negro);font-size:15px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
::selection{background:var(--naranja);color:#fff}
:focus-visible{outline:2px solid var(--naranja);outline-offset:3px}

/* barra */
.bar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(14,14,14,.88);backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--linea)}
.bar h1{font-family:var(--tit);font-size:19px;font-weight:800;letter-spacing:-.03em;margin:0;white-space:nowrap;display:flex;align-items:center;gap:10px}
.bar h1 i{width:8px;height:8px;border-radius:50%;background:var(--naranja);display:block}
.bar h1 small{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:0;color:var(--gris)}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--linea-2);border-radius:100px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.03)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:13px;font-weight:600;color:var(--gris);transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--hueso);color:var(--negro)}
.chip{border:1px solid var(--linea-2);background:rgba(255,255,255,.03);border-radius:100px;padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--hueso)}
.chip[aria-pressed="true"]{border-color:var(--naranja);background:var(--naranja);color:#fff}
select.chip{appearance:none}
select.chip option{background:var(--negro-2);color:var(--hueso)}

/* tablero */
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:var(--negro);background-image:radial-gradient(rgba(255,255,255,.09) 1.2px,transparent 1.2px);background-size:26px 26px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;padding:110px 64px 140px;display:flex;flex-direction:column;gap:96px;width:max-content}
.zoomui{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:6px}
.zoomui button{width:44px;height:44px;border-radius:100px;border:1px solid var(--linea-2);background:rgba(20,20,20,.9);backdrop-filter:blur(8px);font-size:18px;font-weight:600;color:var(--hueso);transition:background .25s var(--sal)}
.zoomui button:hover{background:var(--naranja);border-color:var(--naranja)}

/* fila */
.row{display:flex;gap:24px;align-items:flex-start;position:relative}
.row-title{position:absolute;top:-52px;left:0;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.row-title .n{font-family:var(--tit);font-size:15px;font-weight:800;color:var(--naranja);letter-spacing:.02em}
.row-title .f{font-family:var(--tit);font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
.row-title .m{font-size:14px;color:var(--gris)}

.card{border-radius:18px;cursor:auto}
.ref{width:340px;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--negro-2);border:1px solid var(--linea)}
.ref .who{font-size:13px;color:var(--gris)}
.fijo{border:1.5px solid var(--naranja)}
.fijo .imp{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--negro);background:var(--naranja);border-radius:100px;padding:4px 10px}
.fijo .q{font-size:15px;color:var(--hueso);margin:0}
.fijo textarea{display:block;width:100%;min-height:96px;resize:vertical;border:1px solid var(--linea-2);border-radius:10px;background:var(--negro-3);color:var(--hueso);font:inherit;font-size:15px;line-height:1.4;padding:10px 12px}
.fijo textarea:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(255,77,0,.18)}
.fijo .guardado{font-size:12px;color:var(--gris-2);margin:6px 0 0;min-height:1em}
.ref .who b{color:var(--hueso);font-weight:600}
.vid{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--negro-3);border:1px solid var(--linea);display:grid;place-items:center}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.vid .ph{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--gris);text-align:center;padding:22px;font-size:14px}
.vid .ph button{border:1px solid var(--naranja);background:var(--naranja);color:#fff;border-radius:100px;padding:12px 22px;font-weight:600;transition:transform .3s var(--sal)}
.vid .ph button:hover{transform:translateY(-2px)}
.vid .ph a{font-size:13px}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{font-size:12px;font-weight:500;color:var(--gris);border:1px solid var(--linea-2);border-radius:100px;padding:4px 10px}
.sticky{border-top:1px solid var(--linea);padding:14px 0 0;font-size:14px;color:var(--hueso)}
.sticky h4{margin:0 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--naranja)}
.sticky ol{margin:0;padding-left:18px}
.sticky li{margin:4px 0}
.sticky li::marker{color:var(--gris-2);font-weight:600}
details.tr{border-top:1px solid var(--linea);padding-top:12px}
details.tr summary{font-weight:600;font-size:13px;cursor:pointer;color:var(--gris)}
details.tr pre{white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--gris);margin:10px 0 0;max-height:340px;overflow:auto}

/* guion: campo claro */
.g{width:450px;overflow:hidden;position:relative;background:var(--hueso);color:#141414;border:1px solid transparent;
  --tenue:#63625E; --lin:rgba(0,0,0,.12); transition:box-shadow .3s var(--sal)}
.g header{padding:18px 18px 14px;border-bottom:1px solid var(--lin);position:relative}
.g .var{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin-bottom:8px}
.g .var::before{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--tit);font-size:13px;letter-spacing:0;color:#fff;background:#141414;box-sizing:border-box}
.g[data-v="A"] .var::before{content:"A";background:var(--naranja)}
.g[data-v="B"] .var::before{content:"B"}
.g[data-v="C"] .var::before{content:"C";background:transparent;color:#141414;border:1.5px solid #141414}
.g[data-v="D"] .var::before{content:"D";background:#63625E}
.g h3{font-family:var(--tit);margin:0;font-size:25px;font-weight:800;line-height:1.05;letter-spacing:-.03em;padding-right:48px}
.g .angle{margin:8px 0 0;font-size:13.5px;color:var(--tenue)}
.star{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--lin);background:transparent;font-size:18px;line-height:1;color:#141414;transition:background .25s,color .25s,transform .3s var(--sal)}
.star:hover{transform:scale(1.06)}
.star[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja);color:#fff}
.g.pick{box-shadow:0 0 0 3px var(--naranja)}
.sec{padding:14px 18px;border-bottom:1px solid var(--lin)}
.sec:last-child{border-bottom:0}
.lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.13em;color:var(--naranja);margin:0 0 8px}
.hook{display:grid;gap:6px}
.hook div{font-size:14px}
.hook b{display:inline-block;min-width:56px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tenue)}
.hook .say{font-family:var(--tit);font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.hook .say::before{content:"«"}
.hook .say::after{content:"»"}
.marco{font-size:12.5px;color:var(--tenue);margin-top:6px}
.beats{display:flex;flex-direction:column}
.beat{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--lin)}
.beat:first-child{border-top:0;padding-top:0}
.beat .t{font-size:12px;font-weight:700;color:var(--tenue);font-variant-numeric:tabular-nums;padding-top:3px}
.beat .p{font-size:12.5px;color:var(--tenue)}
.beat .a{font-size:15px;font-weight:500;color:#141414}
.beat .a:empty{display:none}
.beat .d{font-size:12px;color:#C23A00;font-weight:600}
.cta{font-weight:600;font-size:15px}
ul.shots{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.shots li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
ul.shots input{margin-top:3px;accent-color:var(--naranja);width:17px;height:17px;flex-shrink:0}
ul.shots input:checked + label{color:var(--tenue);text-decoration:line-through}
.warn{font-size:13px;background:#141414;color:var(--hueso);border-radius:12px;padding:10px 12px}
.cap{font-size:13px;color:var(--tenue);white-space:pre-line}
.heras{background:#141414;color:var(--hueso)}
body.editing [data-ed]{outline:1px dashed rgba(0,0,0,.28);outline-offset:3px;border-radius:4px;cursor:text}
body.editing [data-ed]:focus{outline:2px solid var(--naranja);background:#fff}
[data-ed].edited{background:rgba(255,77,0,.1);box-shadow:inset 0 -2px 0 var(--naranja)}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.acciones button{border:1px solid rgba(0,0,0,.18);background:transparent;border-radius:100px;padding:7px 14px;font-size:13px;font-weight:600;color:#141414}
.acciones button:hover{border-color:var(--naranja);color:var(--naranja)}
.acciones .reset[hidden]{display:none}
#editar[aria-pressed="true"]{border-color:var(--naranja);background:var(--naranja);color:#fff}
.aviso-ed{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--naranja);color:#fff;border-radius:100px;padding:9px 16px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
body.editing .aviso-ed{display:block}
.heras .lab{color:var(--naranja)}
.heras ul{margin:0;padding-left:18px;font-size:13px;color:var(--gris)}
.heras li{margin:3px 0}

/* intro */
.intro{width:420px;padding:26px;background:var(--negro-2);border:1px solid var(--linea)}
.intro .rotulo{display:block;font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--naranja);margin:0 0 14px}
.intro h2{font-family:var(--tit);margin:0 0 14px;font-size:40px;font-weight:800;line-height:1;letter-spacing:-.038em}
.intro p{margin:0 0 12px;font-size:14.5px;color:var(--gris)}
.intro ul{margin:16px 0 0;padding:16px 0 0 18px;border-top:1px solid var(--linea);font-size:14px}
.intro li{margin:4px 0}
.intro li::marker{color:var(--naranja)}

/* lista (celular) */
body.list #vp{position:static;overflow:visible;touch-action:auto;cursor:auto;min-height:100%}
body.list #world{position:static;transform:none!important;padding:84px 16px 64px;width:auto;gap:72px}
body.list .zoomui{display:none}
body.list .row{flex-direction:column;align-items:stretch;gap:16px}
body.list .row-title{position:static;white-space:normal;flex-wrap:wrap;row-gap:4px}
body.list .row-title .f{font-size:26px}
body.list .row-title .m{flex-basis:100%}
body.list .ref,body.list .intro{width:auto}
body.list .intro h2{font-size:32px}
body.list .scripts{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
body.list .g{flex:0 0 88%;max-width:450px;scroll-snap-align:center}
body.list .vid{max-width:300px;margin:0 auto;width:100%}
.scripts{display:flex;gap:24px;align-items:flex-start}
body.onlypicks .g:not(.pick){display:none}
body.onlypicks .row:not(:has(.g.pick)){display:none}
@media (max-width:700px){
  .bar{gap:6px;padding:10px 12px}
  .bar h1{font-size:16px}
  .bar h1 small,#onlypicks .t,#editar .t{display:none}
  .chip,.seg button{padding:6px 10px;font-size:12px}
  select.chip{max-width:84px}
}
@media (max-width:480px){.seg{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* respuestas de Víctor */
.beat.e .a{font-family:var(--tit);font-weight:700;font-size:16px;letter-spacing:-.01em}
.who-e{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tenue)}
.beat.v .who-v{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#C23A00}
.beat.v .guia{font-size:13px;color:var(--tenue);margin:2px 0 6px}
.beat textarea{display:block;width:100%;min-height:62px;resize:vertical;border:1px solid rgba(0,0,0,.18);border-radius:10px;background:#fff;color:#141414;font:inherit;font-size:15px;line-height:1.4;padding:9px 11px;transition:border-color .2s}
.beat textarea:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(255,77,0,.18)}
.beat textarea.ok{border-color:#141414}
details.ej{margin-top:6px}
details.ej summary{font-size:12.5px;font-weight:600;color:var(--tenue);cursor:pointer;list-style:none}
details.ej summary::-webkit-details-marker{display:none}
details.ej summary::before{content:"+ "}
details.ej[open] summary::before{content:"− "}
details.ej p{margin:6px 0 0;font-size:13.5px;font-style:italic;color:var(--tenue);border-left:2px solid var(--lin);padding-left:10px}
details.hks{margin-top:12px;border-top:1px dashed var(--lin);padding-top:10px}
details.hks summary{font-size:13px;font-weight:700;color:#C23A00;cursor:pointer;list-style:none}
details.hks summary::-webkit-details-marker{display:none}
details.hks summary::before{content:"▸ ";display:inline-block;transition:transform .2s}
details.hks[open] summary::before{transform:rotate(90deg)}
details.hks ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
details.hks li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start;padding:8px 10px;border:1px solid var(--lin);border-radius:10px;background:#fff}
details.hks li.sel{border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja)}
details.hks .mk{grid-column:1;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tenue)}
details.hks .tx{grid-column:1;font-size:14px;line-height:1.35}
details.hks .nt{grid-column:1;font-size:12px;font-style:italic;color:var(--tenue)}
details.hks button{grid-column:2;grid-row:1 / span 3;align-self:center;border:1px solid rgba(0,0,0,.2);background:transparent;border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:600;color:#141414}
details.hks li.sel button{background:var(--naranja);border-color:var(--naranja);color:#fff}
details.hks li.mio{border-style:dashed}
details.hks li .del{grid-column:1;grid-row:auto;justify-self:start;border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--tenue);text-decoration:underline}
details.hks li.sel .del{background:none;color:var(--tenue)}
.hkadd{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:end}
.hkadd textarea{width:100%;min-height:48px;resize:vertical;border:1px solid rgba(0,0,0,.18);border-radius:10px;background:#fff;color:#141414;font:inherit;font-size:14px;line-height:1.35;padding:8px 10px}
.hkadd textarea:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px rgba(255,77,0,.18)}
details.hks .hkadd button{grid-column:2;grid-row:1;align-self:end;background:#141414;border-color:#141414;color:#fff;padding:8px 14px}
.conf{font-size:13px;background:#fff;border:1px solid var(--naranja);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.conf b{color:#C23A00}
.conf .op{display:flex;gap:6px;flex-wrap:wrap}
.conf .op button{border:1px solid rgba(0,0,0,.2);background:transparent;border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:600;color:#141414}
.conf .op button[aria-pressed="true"]{background:#141414;border-color:#141414;color:#fff}
.cont{font-size:12px;font-weight:600;color:var(--tenue);margin-top:10px}
.cont.full{color:#1f7a3a}
.idea-f{font-family:var(--tit);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.idea .sticky p{margin:0;color:var(--gris);font-size:14px}
.idea .op{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--linea);padding-top:14px}
.idea .op button{border:1px solid var(--linea-2);background:transparent;border-radius:100px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--hueso)}
.idea .op button[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja);color:#fff}
#enviar{border-color:var(--naranja);background:var(--naranja);color:#fff}
dialog{border:1px solid var(--linea-2);border-radius:18px;background:var(--negro-2);color:var(--hueso);padding:22px;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-family:var(--tit);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
dialog p{color:var(--gris);font-size:14px;margin:0 0 16px}
dialog .btns{display:grid;gap:8px}
dialog .btns button{border:1px solid var(--linea-2);background:rgba(255,255,255,.04);border-radius:100px;padding:11px 16px;font-weight:600;color:var(--hueso)}
dialog .btns button.pri{background:var(--naranja);border-color:var(--naranja);color:#fff}
dialog .cerrar{margin-top:10px;background:transparent;border:0;color:var(--gris);font-size:13px}
</style>
</head>
<body>
<div class="bar">
  <h1><i></i>Solmi &amp; Asociados<small>guiones · primeros videos</small></h1>
  <span class="sp"></span>
  <select class="chip" id="jump" aria-label="Ir al formato"></select>
  <button class="chip" id="enviar">Enviar <span id="prog"></span></button>
  <div class="seg" role="group" aria-label="Vista">
    <button id="mBoard" aria-pressed="true">Tablero</button>
    <button id="mList" aria-pressed="false">Lista</button>
  </div>
</div>
<div id="vp"><div id="world"></div></div>
<div class="zoomui"><button id="zout" aria-label="Alejar">−</button><button id="zfit" aria-label="Encajar">⤢</button><button id="zin" aria-label="Acercar">+</button></div>

<dialog id="dlg">
  <h2>Tus respuestas</h2>
  <p id="dlgtxt"></p>
  <div class="btns">
    <button class="pri" id="bWa">Mandar por WhatsApp</button>
    <button id="bCopy">Copiar todo</button>
    <button id="bTxt">Descargar como texto</button>
  </div>
  <button class="cerrar" id="bClose">Cerrar</button>
</dialog>

<script src="guiones.js?v=2026-09-21f"></script>
<script>
const D = window.GUIONES;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let resp = store.get('sv-resp', {});
let fijo = store.get('sv-fijo', {});
let conf = store.get('sv-conf', {});
let hkx = store.get('sv-hkx', {});
function allHooks(key, g){ return (g.hooks || []).concat((hkx[key] || []).map(t => ['Tuyo', t, null, true])); }
function hooksList(key, g){
  const hk = conf['hk' + key], n = (g.hooks || []).length;
  return allHooks(key, g).map((x, j) => `<li class="${hk === j ? 'sel' : ''}${x[3] ? ' mio' : ''}"><span class="mk">${esc(x[0])}</span><span class="tx">${esc(x[1])}</span>${x[2] ? `<span class="nt">${esc(x[2])}</span>` : ''}<button type="button" data-hk="${key}" data-i="${j}">${hk === j ? 'Elegido' : 'Este'}</button>${x[3] ? `<button type="button" class="del" data-hkdel="${key}" data-i="${j - n}">Borrar</button>` : ''}</li>`).join('');
}
const nV = g => g.beats.filter(b => b[1] === 'V').length;
const hechas = (key, g) => g.beats.reduce((s, b, i) => s + (b[1] === 'V' && (resp[key + '|' + i] || '').trim() ? 1 : 0), 0);
const guion = key => { for (const r of D.refs) for (const g of r.guiones) if (r.n + g.v === key) return g; };

function renderScript(r, g){
  const key = r.n + g.v;
  const beats = g.beats.map((b, i) => b[1] === 'E'
    ? `<div class="beat e"><div class="t">${esc(b[0])}</div><div><div class="who-e">Emanuel pregunta</div><div class="a">${esc(b[2])}</div></div></div>`
    : `<div class="beat v"><div class="t">${esc(b[0])}</div><div>
        <div class="who-v">Víctor</div>
        <div class="guia">${esc(b[2])}</div>
        <textarea data-r="${key}|${i}" rows="3" aria-label="Respuesta de Víctor, ${esc(b[0])}" placeholder="Escribí cómo lo dirías…" class="${(resp[key + '|' + i] || '').trim() ? 'ok' : ''}">${esc(resp[key + '|' + i] || '')}</textarea>
        ${b[3] ? `<details class="ej"><summary>Ver un ejemplo</summary><p>${esc(b[3])}</p></details>` : ''}
      </div></div>`).join('');
  const h = hechas(key, g), t = nV(g), c = conf[key], hk = conf['hk' + key];
  const hooks = g.hooks ? `<details class="hks"><summary>10 arranques más · o escribí el tuyo</summary><ol data-hkl="${key}">${hooksList(key, g)}</ol><div class="hkadd"><textarea data-hkin="${key}" rows="2" aria-label="Tu propio arranque" placeholder="Escribí tu propio arranque…"></textarea><button type="button" data-hkadd="${key}">Agregar</button></div></details>` : '';
  return `<article class="card g" data-v="${g.v}" data-k="${key}">
    <header>
      <span class="var">${esc(g.tipo)}</span>
      <h3>${esc(g.titulo)}</h3>
      <p class="angle">${esc(g.angulo)}</p>
      <div class="cont ${h === t ? 'full' : ''}" data-cont="${key}">${h} de ${t} respondidas</div>
    </header>
    <div class="sec"><p class="lab">Arranque · primeros 3 segundos · dice ${esc(g.hook.quien)}</p>
      <div class="hook">
        <div class="say" data-say="${key}">${esc(hk != null && g.hooks && allHooks(key, g)[hk] ? allHooks(key, g)[hk][1] : g.hook.dice)}</div>
      </div>
      ${hooks}
    </div>
    <div class="sec"><p class="lab">Guion · ${esc(g.dur)}</p><div class="beats">${beats}</div></div>
    ${g.confirmar ? `<div class="sec"><div class="conf"><div><b>Confirmanos:</b> ${esc(g.confirmar)}</div>
      <div class="op">${['Sí, va así', 'No, cambiarlo', 'Lo hablamos'].map(o => `<button type="button" data-conf="${key}" aria-pressed="${c === o}">${o}</button>`).join('')}</div></div></div>` : ''}
  </article>`;
}

function renderRef(r){
  return `<aside class="card ref">
    <div class="vid" data-embed="${r.id}"><div class="ph"><button type="button">▶ Ver el ejemplo</button><a href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener">abrir en Instagram ↗</a></div></div>
    <div class="who">${r.cuenta ? `<b>${esc(r.cuenta)}</b> · ` : ''}${esc(r.datos || '')}</div>
    <div class="kv">${(r.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
    <div class="sticky"><h4>Por qué funciona</h4><ol>${r.mecanica.map(m => `<li>${esc(m)}</li>`).join('')}</ol></div>
  </aside>`;
}

function prog(){
  let h = 0, t = 0;
  D.refs.forEach(r => r.guiones.forEach(g => { h += hechas(r.n + g.v, g); t += nV(g); }));
  $('#prog').textContent = h + '/' + t;
  return [h, t];
}
function renderIdeas(){
  const I = D.ideas; if (!I) return '';
  return `<section class="row" id="r${I.n}">
    <div class="row-title"><span class="n">${String(I.n).padStart(2,'0')}</span><span class="f">${esc(I.titulo)}</span><span class="m">${esc(I.resumen)}</span></div>
    ${I.items.map((it, j) => `<aside class="card ref idea">
      <div class="vid" data-embed="${it.id}"><div class="ph"><button type="button">▶ Ver el ejemplo</button><a href="https://www.instagram.com/reel/${it.id}/" target="_blank" rel="noopener">abrir en Instagram ↗</a></div></div>
      <h3 class="idea-f">${esc(it.formato)}</h3>
      <div class="who"><b>${esc(it.cuenta)}</b> · ${esc(it.datos)}</div>
      <div class="kv">${it.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <div class="sticky"><h4>Cómo es</h4><ol>${it.mecanica.map(m => `<li>${esc(m)}</li>`).join('')}</ol></div>
      <div class="sticky"><h4>Cómo lo haría Solmi</h4><ol>${it.ideas.map(m => `<li>${esc(m)}</li>`).join('')}</ol></div>
      <div class="sticky"><h4>Qué pide</h4><p>${esc(it.pide)}</p></div>
      <div class="op">${['Lo haría', 'No me convence'].map(o => `<button type="button" data-conf="idea${j}" aria-pressed="${conf['idea' + j] === o}">${o}</button>`).join('')}</div>
    </aside>`).join('')}
  </section>`;
}
function renderFijados(){
  const F = D.fijados; if (!F) return '';
  return `<section class="row" id="rF">
    <div class="row-title"><span class="n">★</span><span class="f">${esc(F.titulo)}</span><span class="m">${esc(F.resumen)}</span></div>
    ${F.items.map((it, j) => `<aside class="card ref idea fijo">
      <span class="imp">Importante · fijado ${esc(it.n)}</span>
      <h3 class="idea-f">${esc(it.formato)}</h3>
      <p class="q">${esc(it.contesta)}</p>
      <div class="sticky"><h4>La idea</h4><ol>${it.ideas.map(m => `<li>${esc(m)}</li>`).join('')}</ol></div>
      <div class="sticky"><h4>Qué pide</h4><p>${esc(it.pide)}</p></div>
      <div class="sticky"><h4>Tus notas</h4>
        <textarea data-f="${j}" rows="4" aria-label="Notas sobre el fijado ${esc(it.n)}" placeholder="Escribí lo que se te ocurra: qué dirías, qué cambiarías…">${esc(fijo[j] || '')}</textarea>
        <p class="guardado" data-fg="${j}">${(fijo[j] || '').trim() ? 'Guardado en este dispositivo ✓' : ''}</p></div>
    </aside>`).join('')}
  </section>`;
}
function render(){
  const intro = `<section class="row" id="r0"><div class="card intro">
    <span class="rotulo">Solmi &amp; Asociados · primeros videos</span>
    <h2>${esc(D.titulo)}</h2>
    ${D.intro.map(p => `<p>${esc(p)}</p>`).join('')}
    <ul>${D.reglas.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
  </div></section>`;
  $('#world').innerHTML = intro + renderFijados() + D.refs.map(r => `<section class="row" id="r${r.n}">
    <div class="row-title"><span class="n">${String(r.n).padStart(2,'0')}</span><span class="f">${esc(r.formato)}</span><span class="m">${esc(r.resumen)}</span></div>
    ${renderRef(r)}
    <div class="scripts">${r.guiones.map(g => renderScript(r, g)).join('')}</div>
  </section>`).join('') + renderIdeas();
  $('#jump').innerHTML = `<option value="0">Ir a…</option>` + (D.fijados ? `<option value="F">★ · Los 3 fijados</option>` : '') + D.refs.map(r => `<option value="${r.n}">${String(r.n).padStart(2,'0')} · ${esc(r.formato)}</option>`).join('') + (D.ideas ? `<option value="${D.ideas.n}">${String(D.ideas.n).padStart(2,'0')} · ${esc(D.ideas.titulo)}</option>` : '');
  prog();
}
render();

/* escribir: se guarda en el dispositivo a cada tecla */
document.addEventListener('input', e => {
  const tf = e.target.closest && e.target.closest('textarea[data-f]');
  if (tf){
    const j = tf.dataset.f;
    if (tf.value.trim()) fijo[j] = tf.value; else delete fijo[j];
    store.set('sv-fijo', fijo);
    document.querySelector(`[data-fg="${j}"]`).textContent = tf.value.trim() ? 'Guardado en este dispositivo ✓' : '';
    return;
  }
  const ta = e.target.closest && e.target.closest('textarea[data-r]');
  if (!ta) return;
  const v = ta.value;
  if (v.trim()) resp[ta.dataset.r] = v; else delete resp[ta.dataset.r];
  store.set('sv-resp', resp);
  ta.classList.toggle('ok', !!v.trim());
  const key = ta.dataset.r.split('|')[0], g = guion(key);
  const h = hechas(key, g), t = nV(g), el = document.querySelector(`[data-cont="${key}"]`);
  el.textContent = h + ' de ' + t + ' respondidas'; el.classList.toggle('full', h === t);
  prog();
});
document.addEventListener('click', e => {
  const hb = e.target.closest('[data-hk]');
  if (hb){
    const key = hb.dataset.hk, j = +hb.dataset.i, g = guion(key), k = 'hk' + key;
    conf[k] = conf[k] === j ? null : j; store.set('sv-conf', conf);
    hb.closest('ol').querySelectorAll('li').forEach((li, i) => {
      li.classList.toggle('sel', conf[k] === i);
      li.querySelector('button').textContent = conf[k] === i ? 'Elegido' : 'Este';
    });
    document.querySelector(`[data-say="${key}"]`).textContent = conf[k] != null ? allHooks(key, g)[conf[k]][1] : g.hook.dice;
    return;
  }
  const ab = e.target.closest('[data-hkadd]');
  if (ab){
    const key = ab.dataset.hkadd, g = guion(key), ta = document.querySelector(`[data-hkin="${key}"]`), t = ta.value.trim();
    if (!t){ ta.focus(); return; }
    (hkx[key] = hkx[key] || []).push(t); store.set('sv-hkx', hkx);
    ta.value = '';
    document.querySelector(`[data-hkl="${key}"]`).innerHTML = hooksList(key, g);
    return;
  }
  const db = e.target.closest('[data-hkdel]');
  if (db){
    const key = db.dataset.hkdel, g = guion(key), i = +db.dataset.i, n = g.hooks.length, k = 'hk' + key;
    hkx[key].splice(i, 1); if (!hkx[key].length) delete hkx[key]; store.set('sv-hkx', hkx);
    if (conf[k] === n + i) conf[k] = null; else if (conf[k] > n + i) conf[k]--;
    store.set('sv-conf', conf);
    document.querySelector(`[data-hkl="${key}"]`).innerHTML = hooksList(key, g);
    document.querySelector(`[data-say="${key}"]`).textContent = conf[k] != null ? allHooks(key, g)[conf[k]][1] : g.hook.dice;
    return;
  }
  const cb = e.target.closest('[data-conf]');
  if (cb){
    const k = cb.dataset.conf, o = cb.textContent;
    conf[k] = conf[k] === o ? null : o; store.set('sv-conf', conf);
    cb.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', conf[k] === b.textContent));
    return;
  }
  const pb = e.target.closest('.vid[data-embed] button');
  if (pb){
    const box = pb.closest('.vid');
    box.innerHTML = `<iframe src="https://www.instagram.com/reel/${box.dataset.embed}/embed" loading="lazy" allowfullscreen scrolling="no"></iframe>`;
  }
});

/* enviar */
function textoTodo(){
  const L = ['RESPUESTAS DE VÍCTOR · guiones Solmi & Asociados', ''];
  D.refs.forEach(r => r.guiones.forEach(g => {
    const key = r.n + g.v;
    L.push('== ' + String(r.n).padStart(2,'0') + g.v + ' · ' + r.formato + ' · ' + g.titulo);
    L.push(g.hook.quien + ': ' + g.hook.dice);
    const AH = g.hooks ? allHooks(key, g) : [];
    if (AH.length && conf['hk' + key] != null && AH[conf['hk' + key]]) L.push('Arranque elegido (' + AH[conf['hk' + key]][0] + '): ' + AH[conf['hk' + key]][1]);
    (hkx[key] || []).forEach(t => L.push('Arranque propio: ' + t));
    g.beats.forEach((b, i) => {
      if (b[1] === 'E') L.push('Emanuel: ' + b[2]);
      else L.push('Víctor: ' + ((resp[key + '|' + i] || '').trim() || '(sin responder)'));
    });
    if (g.confirmar) L.push('Confirmar: ' + g.confirmar + ' → ' + (conf[key] || 'sin respuesta'));
    L.push('');
  }));
  if (D.fijados){ L.push('== ' + D.fijados.titulo); D.fijados.items.forEach((it, j) => L.push(it.n + ' · ' + it.formato + ': ' + ((fijo[j] || '').trim() || '(sin notas)'))); L.push(''); }
  if (D.ideas){ L.push('== ' + D.ideas.titulo); D.ideas.items.forEach((it, j) => L.push(it.formato + ': ' + (conf['idea' + j] || 'sin marcar'))); }
  return L.join('\n');
}
$('#enviar').onclick = () => {
  const [h, t] = prog();
  $('#dlgtxt').textContent = h === t ? 'Están todas. ¡Gracias!' : `Respondiste ${h} de ${t}. Podés mandar lo que tengas y seguir después: queda guardado en este dispositivo.`;
  $('#dlg').showModal();
};
$('#bClose').onclick = () => $('#dlg').close();
$('#bWa').onclick = async () => {
  const t = textoTodo();
  if (navigator.share && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({text: t}); return; } catch {} }
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank', 'noopener');
};
$('#bCopy').onclick = async () => {
  const t = textoTodo();
  try { await navigator.clipboard.writeText(t); }
  catch { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  $('#bCopy').textContent = 'Copiado ✓'; setTimeout(() => $('#bCopy').textContent = 'Copiar todo', 1600);
};
$('#bTxt').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([textoTodo()], {type: 'text/plain;charset=utf-8'}));
  a.download = 'respuestas-victor.txt'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* tablero: pan y zoom */
const vp = $('#vp'), world = $('#world');
let tx = 0, ty = 0, sc = 0.6;
const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
const zoomAt = (f, cx, cy) => {
  const ns = Math.min(1.6, Math.max(0.15, sc * f));
  tx = cx - (cx - tx) * (ns / sc); ty = cy - (cy - ty) * (ns / sc); sc = ns; apply();
};
const pts = new Map(); let last = null, pinch = null;
vp.addEventListener('pointerdown', e => {
  if (document.body.classList.contains('list')) return;
  if (e.target.closest('button,a,input,label,summary,select,iframe,pre,textarea,details,.beats,.cap')) return;
  vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  last = [e.clientX, e.clientY]; vp.classList.add('drag');
});
vp.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2){
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a[0]-b[0], a[1]-b[1]), cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2;
    if (pinch) zoomAt(d / pinch, cx, cy);
    pinch = d; return;
  }
  tx += e.clientX - last[0]; ty += e.clientY - last[1]; last = [e.clientX, e.clientY]; apply();
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) vp.classList.remove('drag'); else last = [...pts.values()][0]; };
vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
vp.addEventListener('wheel', e => {
  if (document.body.classList.contains('list')) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, {passive:false});
$('#zin').onclick = () => zoomAt(1.2, innerWidth/2, innerHeight/2);
$('#zout').onclick = () => zoomAt(1/1.2, innerWidth/2, innerHeight/2);
$('#zfit').onclick = () => { sc = Math.min(1, (innerWidth - 40) / world.scrollWidth); tx = 20; ty = 10; apply(); };

function goTo(n){
  const el = document.getElementById('r' + n); if (!el) return;
  if (document.body.classList.contains('list')){ window.scrollTo({top: el.offsetTop - 60, behavior:'smooth'}); return; }
  sc = Math.max(sc, 0.7);
  tx = 20 - el.offsetLeft * sc; ty = 70 - (el.offsetTop - 50) * sc; apply();
}
$('#jump').onchange = e => { goTo(e.target.value); e.target.value = '0'; };

function setMode(m){
  document.body.classList.toggle('list', m === 'list');
  $('#mList').setAttribute('aria-pressed', m === 'list');
  $('#mBoard').setAttribute('aria-pressed', m !== 'list');
  store.set('sv-mode', m);
  if (m !== 'list') apply();
}
$('#mBoard').onclick = () => setMode('board');
$('#mList').onclick = () => setMode('list');
setMode(store.get('sv-mode', innerWidth < 900 ? 'list' : 'board'));
apply();
</script>
